<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LinguaMaxima Asset Renderer</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #09090b;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- 512x512 Icon SVG -->
    <div id="icon-container">
      <svg
        id="app-icon-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 512 512"
        width="512"
        height="512"
      >
        <defs>
          <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#0ea5e9" />
            <stop offset="100%" stop-color="#0284c7" />
          </linearGradient>

          <linearGradient id="highlight-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>

          <linearGradient id="page-sub" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#bae6fd" />
            <stop offset="100%" stop-color="#7dd3fc" />
          </linearGradient>

          <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>

          <filter
            id="shadow-filter"
            x="-10%"
            y="-10%"
            width="130%"
            height="130%"
          >
            <feDropShadow
              dx="0"
              dy="8"
              stdDeviation="10"
              flood-color="#0369a1"
              flood-opacity="0.4"
            />
          </filter>

          <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow
              dx="0"
              dy="2"
              stdDeviation="6"
              flood-color="#f59e0b"
              flood-opacity="0.5"
            />
          </filter>
        </defs>

        <!-- Squircle Background -->
        <rect
          x="24"
          y="24"
          width="464"
          height="464"
          rx="108"
          fill="url(#bg-grad)"
        />
        <rect
          x="24"
          y="24"
          width="464"
          height="232"
          rx="108"
          fill="url(#highlight-grad)"
        />
        <rect
          x="25"
          y="25"
          width="462"
          height="462"
          rx="107"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          stroke-opacity="0.25"
        />

        <!-- Center Elements -->
        <g filter="url(#shadow-filter)">
          <!-- Secondary Bilingual Page Arc -->
          <path
            d="M208 196 C248 184 316 190 364 218 C374 224 380 234 380 246 L380 268 C380 278 370 285 360 280 C318 258 256 254 208 266 Z"
            fill="url(#page-sub)"
          />

          <!-- Main "L" Monogram / Open Spine -->
          <path
            d="M136 128 C136 112.5 148.5 100 164 100 C179.5 100 192 112.5 192 128 L192 320 C192 331 201 340 212 340 L356 340 C371.5 340 384 352.5 384 368 C384 383.5 371.5 396 356 396 L192 396 C161 396 136 371 136 340 Z"
            fill="#ffffff"
          />

          <!-- Upper Reading Page Wing -->
          <path
            d="M208 276 C256 260 324 266 372 296 C382 302 388 312 388 324 L388 334 C388 344 378 350 368 344 C328 322 264 318 208 332 Z"
            fill="#f0f9ff"
          />
        </g>

        <!-- AI Spark -->
        <g filter="url(#glow-filter)">
          <path
            d="M376 96 C376 122 396 142 422 142 C396 142 376 162 376 188 C376 162 356 142 330 142 C356 142 376 122 376 96 Z"
            fill="url(#spark-grad)"
          />
          <circle cx="334" cy="98" r="5" fill="#fef08a" opacity="0.9" />
        </g>
      </svg>
    </div>

    <!-- 1200x630 OG Banner SVG -->
    <div id="og-container" style="margin-top: 30px">

        viewBox="0 0 1200 630"

            <stop offset="0%" stop-color="#0c2138" />
            <stop offset="50%" stop-color="#090e17" />
            <stop offset="100%" stop-color="#05070b" />
          </radialGradient>

          <radialGradient
            id="og-glow"
            cx="260"
            cy="315"
            r="300"
            gradientUnits="userSpaceOnUse"

            <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
            <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
          </radialGradient>

          <linearGradient id="og-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#f0f9ff" />
            <stop offset="100%" stop-color="#bae6fd" />
          </linearGradient>

          <linearGradient id="og-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#818cf8" />
          </linearGradient>

          <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
          </linearGradient>
        </defs>

        <!-- Background with Rich Glow & Grid -->
        <rect width="1200" height="630" fill="url(#og-radial)" />
        <circle cx="260" cy="315" r="300" fill="url(#og-glow)" />

        <!-- Subtle background grid lines -->
        <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
          <line x1="0" y1="105" x2="1200" y2="105" />
          <line x1="0" y1="210" x2="1200" y2="210" />
          <line x1="0" y1="315" x2="1200" y2="315" />
          <line x1="0" y1="420" x2="1200" y2="420" />
          <line x1="0" y1="525" x2="1200" y2="525" />
          <line x1="200" y1="0" x2="200" y2="630" />
          <line x1="400" y1="0" x2="400" y2="630" />
          <line x1="600" y1="0" x2="600" y2="630" />
          <line x1="800" y1="0" x2="800" y2="630" />
          <line x1="1000" y1="0" x2="1000" y2="630" />
        </g>

        <!-- Border accent -->
        <rect
          x="2"
          y="2"

          height="626"
          rx="24"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1.5"
          stroke-opacity="0.2"

        <!-- App Icon Embedded on Left -->

          <!-- Squircle Background -->

            fill="url(#bg-grad)"
          />
          <rect
            x="24"
            y="24"
            width="464"
            height="232"
            rx="108"
            fill="url(#highlight-grad)"
          />
          <rect
            x="25"
            y="25"
            width="462"
            height="462"
            rx="107"
            fill="none"
            stroke="#ffffff"
            stroke-width="3"
            stroke-opacity="0.3"
          />

          <!-- Inner Content Group -->
          <g filter="url(#shadow-filter)">
            <path
              d="M208 196 C248 184 316 190 364 218 C374 224 380 234 380 246 L380 268 C380 278 370 285 360 280 C318 258 256 254 208 266 Z"
              fill="url(#page-sub)"
            />
            <path
              d="M136 128 C136 112.5 148.5 100 164 100 C179.5 100 192 112.5 192 128 L192 320 C192 331 201 340 212 340 L356 340 C371.5 340 384 352.5 384 368 C384 383.5 371.5 396 356 396 L192 396 C161 396 136 371 136 340 Z"
              fill="#ffffff"
            />
            <path
              d="M208 276 C256 260 324 266 372 296 C382 302 388 312 388 324 L388 334 C388 344 378 350 368 344 C328 322 264 318 208 332 Z"
              fill="#f0f9ff"
            />
          </g>

          <!-- Spark -->
          <g filter="url(#glow-filter)">
            <path
              d="M376 96 C376 122 396 142 422 142 C396 142 376 162 376 188 C376 162 356 142 330 142 C356 142 376 122 376 96 Z"

        <!-- Right Content Section -->
        <g transform="translate(410, 0)">
          <!-- Top Category Badge -->
          <rect

            y="160"
            width="310"
            height="38"
            rx="19"
            fill="#0369a1"
            fill-opacity="0.3"
            stroke="#0284c7"
            stroke-opacity="0.6"
            stroke-width="1.5"
          />
          <text

            y="184"
            fill="#38bdf8"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
            font-size="15"
            font-weight="700"
            letter-spacing="1.2"

            ✦ AI LANGUAGE PLATFORM

          <!-- Title -->
          <text

            y="270"
            fill="url(#og-text-grad)"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
            font-size="64"
            font-weight="900"
            letter-spacing="-1.5"
          >
            LinguaMaxima
          </text>

          <!-- Subtitle -->
          <text
            x="0"
            y="325"
            fill="#94a3b8"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
            font-size="23"
            font-weight="500"
            letter-spacing="-0.3"
          >
            AI-Powered Graded Reader &amp; Spaced Repetition

          <!-- Feature Pills Row -->
          <g transform="translate(0, 380)">
            <!-- Pill 1: CEFR A1-C2 -->
            <g>
              <rect

              <text

                font-size="15"
                font-weight="600"

                📚 CEFR A1–C2

            </g>

            <!-- Pill 2: Dual Translations -->
            <g transform="translate(175, 0)">
              <rect
                x="0"

                width="200"
                height="42"
                rx="12"
                fill="#0f172a"
                stroke="#1e293b"
                stroke-width="1.5"
              />
              <text
                x="18"
                y="26"
                fill="#e2e8f0"
                font-family="sans-serif"
                font-size="15"
                font-weight="600"
              >
                ⚡ Parallel Reader
              </text>
            </g>

            <!-- Pill 3: SM-2 Spaced Repetition -->
            <g transform="translate(390, 0)">
              <rect
                x="0"
                y="0"
                width="195"
                height="42"
                rx="12"
                fill="#0f172a"
                stroke="#1e293b"
                stroke-width="1.5"
              />
              <text
                x="18"
                y="26"
                fill="#e2e8f0"
                font-family="sans-serif"
                font-size="15"
                font-weight="600"
              >
                🧠 SuperMemo SM-2
              </text>
            </g>

            <!-- Pill 4: Neural TTS -->
            <g transform="translate(600, 0)">
              <rect
                x="0"
                y="0"
                width="135"
                height="42"
                rx="12"
                fill="#0f172a"
                stroke="#1e293b"
                stroke-width="1.5"
              />
              <text
                x="18"
                y="26"
                fill="#38bdf8"
                font-family="sans-serif"
                font-size="15"
                font-weight="600"
              >
                🎧 Neural Audio
              </text>
            </g>
          </g>

          <!-- Bottom Domain / URL watermark -->
          <text
            x="0"
            y="475"
            fill="#38bdf8"
            font-family="sans-serif"
            font-size="18"
            font-weight="700"
            letter-spacing="0.5"
          >
            linguamaxima-web.vercel.app
          </text>
        </g>
      </svg>
    </div>

    <script>
      async function renderToDataURL(svgElement, width, height) {
        const xml = new XMLSerializer().serializeToString(svgElement);
        const svg64 = btoa(unescape(encodeURIComponent(xml)));
        const image64 = "data:image/svg+xml;base64," + svg64;

        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = image64;
        });

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, width, height);

        return canvas.toDataURL("image/png");
      }

      window.generateAllAssets = async function () {
        const iconSvg = document.getElementById("app-icon-svg");
        const ogSvg = document.getElementById("og-svg");

        const results = {};
        results["favicon-16x16.png"] = await renderToDataURL(iconSvg, 16, 16);
        results["favicon-32x32.png"] = await renderToDataURL(iconSvg, 32, 32);
        results["favicon-48x48.png"] = await renderToDataURL(iconSvg, 48, 48);
        results["apple-touch-icon.png"] = await renderToDataURL(
          iconSvg,
          180,
          180
        );
        results["android-chrome-192x192.png"] = await renderToDataURL(
          iconSvg,
          192,
          192
        );
        results["android-chrome-512x512.png"] = await renderToDataURL(
          iconSvg,
          512,
          512
        );
        results["og-image.png"] = await renderToDataURL(ogSvg, 1200, 630);

        return results;
      };
    </script>
  </body>
</html>
