<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Top Highlight -->
    <linearGradient id="lm-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Page Layer 1 Gradient -->
    <linearGradient id="lm-page1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Page Layer 2 Gradient (Secondary / Parallel Language) -->
    <linearGradient id="lm-page2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- AI Spark Gradient -->
    <linearGradient id="lm-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow for Icon Elements -->
    <filter id="lm-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.45" />
    </filter>

    <!-- Spark Glow -->
    <filter id="lm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Radial & Linear Depth -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#lm-bg)" />
  <rect x="24" y="24" width="464" height="232" rx="112" fill="url(#lm-highlight)" />
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Inner Content Group with Shadow -->
  <g filter="url(#lm-shadow)">
    <!-- Secondary Parallel Page Layer (Bilingual Reader Depth) -->
    <path
      d="M208 196 C248 184 316 190 364 218 C374 224 380 234 380 246 L380 268 C380 278 370 285 360 280 C318 258 256 254 208 266 Z"
      fill="url(#lm-page2)"
      opacity="0.9"
    />

    <!-- Main "L" Monogram & Primary Open Book Spine -->
    <!-- Vertical Spine + Bottom Base of "L" as a continuous harmonious geometric shape -->
    <path
      d="M136 128 C136 112.5 148.5 100 164 100 C179.5 100 192 112.5 192 128 L192 320 C192 331 201 340 212 340 L356 340 C371.5 340 384 352.5 384 368 C384 383.5 371.5 396 356 396 L192 396 C161 396 136 371 136 340 Z"
      fill="url(#lm-page1)"
    />

    <!-- Upper Reading Page Wing (Dynamic Flow) -->
    <path
      d="M208 276 C256 260 324 266 372 296 C382 302 388 312 388 324 L388 334 C388 344 378 350 368 344 C328 322 264 318 208 332 Z"
      fill="#ffffff"
      opacity="0.95"
    />
  </g>

  <!-- AI 4-Point Innovation Spark / Globe Meridian Symbol (Top Right) -->
  <g filter="url(#lm-glow)">
    <!-- Center 4-Point Star -->
    <path
      d="M376 96 C376 122 396 142 422 142 C396 142 376 162 376 188 C376 162 356 142 330 142 C356 142 376 122 376 96 Z"
      fill="url(#lm-spark)"
    />
    <!-- Small auxiliary twinkle -->
    <circle cx="334" cy="98" r="5" fill="#fef08a" opacity="0.85" />
  </g>
</svg>
