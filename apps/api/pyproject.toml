[project]
name = "linguamaxima-api"
version = "0.1.0"
description = "AI-powered language learning platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "litellm>=1.50.0",
  "httpx>=0.28.0",
  "edge-tts>=7.0.0",
  "pillow>=11.0.0",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.9.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
